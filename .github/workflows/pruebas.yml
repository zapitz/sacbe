name: pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependencias con hashes
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Pruebas
        run: python -m pytest

  cliente:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.10", anthropic: "0.42.0"}
          - {python: "3.11", anthropic: "0.109.2"}
          - {python: "3.13", anthropic: "1.11.0"}
          - {python: "3.13", anthropic: "2.12.0"}
    defaults:
      run:
        working-directory: cliente
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar el SDK de Anthropic ${{ matrix.anthropic }}
        run: python -m pip install "anthropic==${{ matrix.anthropic }}" "pytest>=8"
      - name: Pruebas de la librería sacbe
        run: python -m pytest
