name: pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependencias con hashes
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Pruebas
        run: python -m pytest
